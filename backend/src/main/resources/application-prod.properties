# ==========================================================
# Travora Production Profile
# Activated via: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==========================================================

# Strict schema validation - Flyway owns all migrations in production
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# High-concurrency connection pool for 1,000 corporate employees
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=10000

# Security and monitoring
spring.security.debug=false
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.traveldesk.backend=INFO
