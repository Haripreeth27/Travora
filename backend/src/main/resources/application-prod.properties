# ==========================================================
# Travora Production Profile
# Activated via: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==========================================================

server.port=${PORT:10000}
server.address=0.0.0.0

# Auto-update schema to self-heal missing tables and columns in production
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
server.error.include-message=always
server.error.include-binding-errors=always

# High-concurrency connection pool for 1,000 corporate employees
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=10000

# Security and monitoring
spring.security.debug=false
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.traveldesk.backend=INFO

# ==========================================================
# Trapple AI Assistant Configuration
# ==========================================================
ai.provider=${AI_PROVIDER:openai}
ai.model=${AI_MODEL:gpt-4o}
ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:2048}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.enabled=${AI_ENABLED:true}
ai.max-requests-per-user=${AI_MAX_REQUESTS_PER_USER:100}
ai.monthly-budget=${AI_MONTHLY_BUDGET:500.00}

