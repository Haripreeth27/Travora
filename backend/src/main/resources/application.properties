server.port=${PORT:8080}
spring.application.name=traveldesk-backend

# Datasource configuration
spring.datasource.url=${TRAVORA_DB_URL:jdbc:postgresql://localhost:5432/traveldesk}
spring.datasource.username=${TRAVORA_DB_USERNAME:postgres}
spring.datasource.password=${TRAVORA_DB_PASSWORD:postgres}

# Database Migration & Schema Management
spring.flyway.enabled=${TRAVORA_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=${TRAVORA_DDL_AUTO:validate}
spring.jpa.show-sql=${TRAVORA_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# HikariCP Connection Pooling (Optimized for 1,000 corporate users)
spring.datasource.hikari.maximum-pool-size=${TRAVORA_DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${TRAVORA_DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# Security & CORS
app.jwt.secret=${TRAVORA_JWT_SECRET:}
app.cors.allowed-origins=${TRAVORA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001}
spring.security.debug=${TRAVORA_SECURITY_DEBUG:false}

# Logging
logging.level.org.springframework.security=${TRAVORA_SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${TRAVORA_WEB_LOG_LEVEL:INFO}
logging.level.com.traveldesk.backend=${TRAVORA_APP_LOG_LEVEL:INFO}

# File upload limits (Excel/CSV imports)
spring.servlet.multipart.max-file-size=${TRAVORA_UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${TRAVORA_UPLOAD_MAX_REQUEST_SIZE:25MB}
